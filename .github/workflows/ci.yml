name: CI
on:
  push: { branches: [main, master], tags: ['v*'] }
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy ke VPS produksi setelah test lulus
        type: boolean
        default: false

# Token GitHub bawaan hanya bisa membaca repo (prinsip hak akses minimum)
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_USER: masrim, POSTGRES_PASSWORD: masrim_dev, POSTGRES_DB: masrim }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U masrim" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://masrim:masrim_dev@localhost:5432/masrim
      TEST_DATABASE_URL: postgres://masrim:masrim_dev@localhost:5432/masrim_test
      JWT_SECRET: ci-secret-yang-cukup-panjang-untuk-pengujian-otomatis
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm test
      - name: Audit dependensi (high/critical)
        run: pnpm audit --prod --audit-level high

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Validasi docker-compose.prod.yml
        run: |
          cp deploy/.env.prod.example .env
          sed -i 's/^POSTGRES_PASSWORD=$/POSTGRES_PASSWORD=ci/; s/^MINIO_ROOT_PASSWORD=$/MINIO_ROOT_PASSWORD=ci-minio-pass/; s/^MINIO_APP_PASSWORD=$/MINIO_APP_PASSWORD=ci-minio-app-pass-123/; s/^REDIS_PASSWORD=$/REDIS_PASSWORD=ci-redis/' .env
          touch server/.env.production
          docker compose -f docker-compose.prod.yml config --quiet
      - name: Validasi Caddyfile
        run: docker run --rm -e DOMAIN=contoh.com -e ACME_EMAIL=a@contoh.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Build image api, web, backup
        run: |
          docker build -f deploy/Dockerfile.api --build-arg APP_VERSION=${GITHUB_SHA::7} -t masrim-api:ci .
          docker build -f deploy/Dockerfile.web -t masrim-web:ci .
          docker build -f deploy/Dockerfile.backup -t masrim-backup:ci .

  deploy:
    # Jalan otomatis saat push tag v* (mis. v1.0.0), atau manual (Run workflow → centang deploy).
    # Butuh secrets: DEPLOY_HOST, DEPLOY_USER, DEPLOY_SSH_KEY (dan opsional DEPLOY_PORT, DEPLOY_PATH).
    needs: [test, docker]
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.deploy)
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          # Sidik jari host key server (ssh-keyscan host | ssh-keygen -lf -) — mencegah serangan man-in-the-middle
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          command_timeout: 30m
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/opt/masrim' }}
            ./deploy/deploy.sh ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'main' }}
